# Builds the site and uploads dist/ to the web host on every push to main.
# FTP credentials live in the repository secrets (Settings → Secrets and
# variables → Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels a deploy still running, so two uploads never overlap
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major version as local, so npm reads the lock file the same way
          node-version: 24
          cache: npm

      # npm ci rejects the lock file made on Windows (missing Linux-only
      # @emnapi packages); npm install fills them in instead of failing
      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      # Only uploads the files that changed since the last deploy, and removes
      # the ones that no longer exist (old hashed files in assets/)
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps
